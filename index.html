<div id="app"></div>

<script>
// ───────────────────────── CONFIG ─────────────────────────
const HOURLY_RATE = 44;
const DEFAULT_CREDIT_POINTS = 2.25;   // для нового пользователя: гражданин-мужчина; своё значение — из листка
const POINT_VALUE_2026 = 242;         // ₪ в месяц за 1 балл
const DEFAULT_PENSION_PCT = 6;        // пенсия, % с оплаты за смены
const DEFAULT_KEHESH_PCT  = 2.5;      // керен иштальмут, %
const NOF_HAGALIL_RATE = 0.12;        // скидка жителей Ноф-ха-Галиль (пресет)
const NOF_HAGALIL_CEILING_YEAR = 226560; // годовой потолок дохода для скидки (пресет)
const PENSION_CREDIT_RATE = 0.35;     // зачёт по ст. 45א с взносов работника
const STORAGE_KEY = "salary_calc_v1";

// Ступени подоходного налога 2026 (трудовой доход): [верхняя граница, ставка]
const BRACKETS_MONTH = [[7010,.10],[10060,.14],[19000,.20],[25100,.31],[46690,.35],[Infinity,.47]];
const BRACKETS_YEAR  = [[84120,.10],[120720,.14],[228000,.20],[301200,.31],[560280,.35],[Infinity,.47]];
function bracketTax(g, table) {
  let prev = 0, t = 0;
  for (let i = 0; i < table.length; i++) {
    const lim = table[i][0], r = table[i][1];
    if (g > prev) t += (Math.min(g, lim) - prev) * r;
    prev = lim;
  }
  return t;
}
// Подоходный налог за месяц: ступени − баллы − скидка жителя − зачёт за пенсию
function calcIncomeTax(g, creditPts, benefitOn, benefitPct, benefitCeilMonth, pensionCredit) {
  const raw = bracketTax(g, BRACKETS_MONTH);
  const pts = (Number(creditPts) || 0) * POINT_VALUE_2026;
  const ben = benefitOn ? Math.min(g, benefitCeilMonth) * (benefitPct / 100) : 0;
  return Math.max(0, raw - pts - ben - (pensionCredit || 0));
}
// Битуах Леуми + мас бриут (работник), 2026: до 7 703 ₪ — 1.04%+3.23%, выше — 7%+5.17% (сверено с листком за июнь)
const BL_THRESHOLD = 7703;
function calcBituachLeumi(g) {
  const t = BL_THRESHOLD;
  if (g <= t) return g * 0.0427;
  return t*0.0427 + (g-t)*0.1217;
}

const SHIFT_TYPES = {
  morning:          { label: "🌅 Утро 8ч",            hours: 8,  group: "regular",   color:"#ea580c" },
  morning12:        { label: "🌅 Утро 12ч",           hours: 12, group: "regular",   color:"#c2410c" },
  day:              { label: "☀️ День 8ч",            hours: 8,  group: "regular",   color:"#2563eb" },
  day12:            { label: "☀️ День 12ч",           hours: 12, group: "regular",   color:"#1d4ed8" },
  night8:           { label: "🌙 Ночь 8ч",            hours: 8,  group: "regular",   color:"#3730a3" },
  night12:          { label: "🌙 Ночь 12ч",           hours: 12, group: "regular",   color:"#312e81" },
  tor_morning:      { label: "⚡ Тор. Утро 8ч",       hours: 8,  group: "torranuta", color:"#ea580c" },
  tor_morning12:    { label: "⚡ Тор. Утро 12ч",      hours: 12, group: "torranuta", color:"#c2410c" },
  tor_day:          { label: "⚡ Тор. День 8ч",       hours: 8,  group: "torranuta", color:"#2563eb" },
  tor_day12:        { label: "⚡ Тор. День 12ч",      hours: 12, group: "torranuta", color:"#1d4ed8" },
  tor_night8:       { label: "⚡ Тор. Ночь 8ч",       hours: 8,  group: "torranuta", color:"#3730a3" },
  tor_night12:      { label: "⚡ Тор. Ночь 12ч",      hours: 12, group: "torranuta", color:"#312e81" },
  off:              { label: "🔴 Выходной",             hours: 0,  group: "off",       color:"#1e293b" },
};

function baseType(t) {
  if (t.startsWith("tor_")) return t.slice(4); // tor_night8 → night8
  return t;
}

// ── Параметры смен: старт (час суток), длительность, класс тарифа ──────────
// Класс определяет базовый коэффициент по номеру отработанного часа:
//   morning (старт до 14:00): 1-8ч 100%, 9-10ч 125%, 11+ч 150%
//   day     (вечерняя):       1-8ч 117.5%, 9-10ч 125%, 11+ч 150%
//   night:                    1-7ч 140%, 8-9ч 175%, 10+ч 210%
// В шабат (пт с 17:00 до сб 17:00) коэффициент удваивается: 100→200, 117.5→235,
// 125→250, 140→280, 150→300, 175→350, 210→420 (проверено по табелям июнь-август).
const SHIFT_SPEC = {
  morning:   { start: 6,   hours: 8,  cls: "morning" },
  morning12: { start: 6,   hours: 12, cls: "morning" },
  day:       { start: 14,  hours: 8,  cls: "day" },
  day12:     { start: 9.5, hours: 12, cls: "morning" },   // по табелям: вход ~09:30, тариф как у утра
  night8:    { start: 22,  hours: 8,  cls: "night" },
  night12:   { start: 22,  hours: 12, cls: "night" }
};
const SHABBAT_START = 17;          // пятница, час суток
const SHABBAT_END   = 24 + 17;     // суббота 17:00, часов от полуночи пятницы

function baseCoef(cls, workedHours) {
  if (cls === "night") return workedHours < 7 ? 140 : (workedHours < 9 ? 175 : 210);
  const first = cls === "day" ? 117.5 : 100;
  return workedHours < 8 ? first : (workedHours < 10 ? 125 : 150);
}

// kind: false | "fri" | "sat" — на какой день недели начинается смена
function calcShift(type, kind, rate) {
  rate = rate || HOURLY_RATE;
  if (type === "off" || !type) return { total: 0, breakdown: [] };
  if (kind === true) kind = "sat";
  const def = SHIFT_TYPES[type];
  const isTor = def && def.group === "torranuta";
  const base = baseType(type);
  const spec = SHIFT_SPEC[base];
  if (!spec) return { total: 0, breakdown: [] };

  // считаем по получасовым отрезкам
  const groups = {};   // ключ: pct|shab → часы
  const order = [];
  const STEP = 0.5;
  for (let k = 0; k < spec.hours / STEP; k++) {
    const worked = k * STEP;
    const clock = spec.start + worked + STEP / 2;      // середина отрезка
    let shab = false;
    if (kind === "fri") shab = clock >= SHABBAT_START && clock < SHABBAT_END;
    else if (kind === "sat") shab = clock < SHABBAT_START;
    const basePct = baseCoef(spec.cls, 0) * (shab ? 2 : 1);
    const pct = baseCoef(spec.cls, worked) * (shab ? 2 : 1);
    const gk = pct + "|" + (shab ? 1 : 0);
    if (!(gk in groups)) { groups[gk] = { pct: pct, shab: shab, hrs: 0, reg: pct === basePct }; order.push(gk); }
    groups[gk].hrs += STEP;
  }
  const breakdown = [];
  let total = 0, regular = 0;
  order.forEach(function (gk) {
    const g = groups[gk];
    const sum = Math.round(g.hrs * rate * g.pct / 100 * 100) / 100;
    breakdown.push({
      label: (g.shab ? "✡️ שבת " : "") + g.pct + "%",
      hrs: g.hrs, pct: g.pct, sum: sum
    });
    total += sum;
    if (g.reg) regular += sum;
  });

  // ── ТОРРАНУТА: надбавка (коды 132/133/134/136 = 50/58.8/70/117.5%) за 8ч × ставка.
  if (isTor) {
    // Авто: код надбавки зависит от смены: утро 50%, вечер 58.8%, ночь 70%,
    // шабат (сб до 17:00 / пт ночь) 117.5% — по листкам июня-августа
    let autoPct = spec.cls === "night" ? 70 : (spec.cls === "day" ? 58.8 : 50);
    if ((kind === "sat" && spec.start < SHABBAT_START) || (kind === "fri" && spec.start >= SHABBAT_START)) autoPct = 117.5;
    const manual = (typeof state !== "undefined" && state.torAuto === false);
    const torPct = manual ? (state.torPct || 58.8) : autoPct;
    const torBonus = Math.round(8 * rate * torPct / 100 * 100) / 100;
    breakdown.push({ label: "⚡ Тор. надбавка (" + torPct + "%×8ч)", hrs: 8, pct: torPct, sum: torBonus });
    total += torBonus;
  }
  return { total: Math.round(total*100)/100, regular: Math.round(regular*100)/100, breakdown: breakdown };
}

function computeStats() {
  const daysInMonth = getDaysInMonth(state.year, state.month);
  const firstDay = getFirstDay(state.year, state.month);
  let totalGross=0, totalHours=0, workDays=0, regularPay=0;
  const weekly = {};
  for (let d=1; d<=daysInMonth; d++) {
    const sh = getShift(d);
    if (sh.type === "off") continue;
    const sab = isSabbath(state.year, state.month, d);
    const r = calcShift(sh.type, shabKind(state.year, state.month, d), state.hourlyRate);
    const h = (SHIFT_TYPES[sh.type] && SHIFT_TYPES[sh.type].hours) || 0;
    totalGross += r.total; regularPay += r.regular || 0; totalHours += h; workDays++;
    const wn = Math.ceil((d+firstDay)/7);
    if (!weekly[wn]) weekly[wn] = { gross:0, hours:0, days:0 };
    weekly[wn].gross += r.total; weekly[wn].hours += h; weekly[wn].days++;
  }
  return { totalGross: Math.round(totalGross*100)/100, regularPay: Math.round(regularPay*100)/100, totalHours, workDays, weekly };
}

function computeNet(stats) {
  const shiftsGross = stats.totalGross;
  const premium = getPremium(), extras = getExtras();
  const gross = shiftsGross + premium + extras;
  const zkifot = Number(state.zkifot) || 0;      // условные начисления: облагаются, но не выплачиваются
  const taxBase = gross + zkifot;
  // По листку: пенсия — с обычной оплаты смен (без переработки и надбавок) + премия; керен — только с обычной оплаты
  const regular = stats.regularPay !== undefined ? stats.regularPay : shiftsGross;
  const pension = state.includePension ? (regular + premium) * (Number(state.pensionPct)||0) / 100 : 0;
  const kehesh  = state.includePension ? regular * (Number(state.keheshPct)||0) / 100 : 0;
  const bituach = calcBituachLeumi(taxBase);
  const pensionCredit = (state.includePension && state.pensionCreditOn) ? pension * PENSION_CREDIT_RATE : 0;
  const ceilMonth = (Number(state.benefitCeilYear)||0) / 12;
  const incomeTax = calcIncomeTax(taxBase, state.creditPoints, state.nofHagalil, Number(state.benefitPct)||0, ceilMonth, pensionCredit);
  const totalDeductions = incomeTax + bituach + pension + kehesh;
  const net = Math.max(0, gross - totalDeductions);
  const rawTax = bracketTax(taxBase, BRACKETS_MONTH);
  const pointsShield = (Number(state.creditPoints)||0) * POINT_VALUE_2026;
  const nofShield = state.nofHagalil ? Math.min(taxBase, ceilMonth) * (Number(state.benefitPct)||0) / 100 : 0;
  return { shiftsGross, premium, extras, gross, pension, kehesh, bituach, incomeTax, rawTax, pointsShield, nofShield, pensionCredit, totalDeductions, net };
}

// Годовой прогноз налога по всем введённым месяцам года (годовые ступени)
function computeYear() {
  const m0 = state.month;
  let T = 0, months = 0, monthlySum = 0, pensionSum = 0;
  try {
    for (let m = 0; m < 12; m++) {
      state.month = m;
      const st = computeStats();
      if (st.workDays === 0) continue;
      const n = computeNet(st);
      T += n.gross + (Number(state.zkifot)||0); monthlySum += n.incomeTax; pensionSum += n.pension; months++;
    }
  } finally { state.month = m0; }
  const raw = bracketTax(T, BRACKETS_YEAR);
  const pts = (Number(state.creditPoints)||0) * POINT_VALUE_2026 * 12;
  const ben = state.nofHagalil ? Math.min(T, Number(state.benefitCeilYear)||0) * (Number(state.benefitPct)||0) / 100 : 0;
  const pc = (state.includePension && state.pensionCreditOn) ? pensionSum * PENSION_CREDIT_RATE : 0;
  const tax = Math.max(0, raw - pts - ben - pc);
  return { T, months, tax, monthlySum };
}

// ───────────────────────── CYCLE SCHEDULE ─────────────────────────
function applyCycle(startYear, startMonth, startDay, monthsAhead) {
  // Build flat cycle array from template
  const cycle = [];
  state.cycleTemplate.forEach(block => {
    for (let i = 0; i < block.count; i++) {
      cycle.push(block.isOff ? "off" : block.type);
    }
  });
  if (!cycle.length) return;

  // Start from given date
  let y = startYear, m = startMonth, d = startDay;
  const endYear  = startMonth + monthsAhead > 11 ? startYear + Math.floor((startMonth + monthsAhead)/12) : startYear;
  const endMonth = (startMonth + monthsAhead) % 12;

  // Don't overwrite beyond end boundary
  const pastEnd = (cy, cm) => {
    if (cy > endYear) return true;
    if (cy === endYear && cm > endMonth) return true;
    return false;
  };

  let cycleIdx = 0;
  while (!pastEnd(y, m)) {
    const dim = getDaysInMonth(y, m);
    while (d <= dim && !pastEnd(y, m)) {
      const k = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      state.shifts[k] = { type: cycle[cycleIdx % cycle.length] };
      cycleIdx++;
      d++;
    }
    d = 1;
    m++;
    if (m > 11) { m = 0; y++; }
  }
  saveData();
}

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  attrs = attrs || {};
  for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "text") e.textContent = attrs[k];
    else if (k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => { if (c) e.appendChild(c); });
  return e;
}

        const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        let done = false; try { done = document.execCommand("copy"); } catch (e) {}
        ta.remove(); if (done) ok(); else alert("Не удалось скопировать.");
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok, legacy); else legacy();
    });
    backup.appendChild(copyBtn);
    const pasteBtn = el("button", { class:"toggle-btn", style:"justify-content:center;margin-top:8px", text:"📥 Вставить данные" });
    const pasteBox = el("div", { style:"display:none;margin-top:8px" });
    const pasteTa = el("textarea", { class:"num-input", placeholder:"Нажми и удерживай здесь → Вставить", style:"width:100%;height:90px;box-sizing:border-box;font-size:12px" });
    const pasteGo = el("button", { class:"toggle-btn", style:"justify-content:center;margin-top:6px", text:"✔️ Загрузить вставленные данные" });
    const importText = (txt) => {
      let d; const t = String(txt || "").trim(); const i = t.indexOf("{"), j = t.lastIndexOf("}");
      try { d = JSON.parse(t.slice(i, j + 1)); } catch (e) { alert("Это не данные калькулятора. Скопируй сообщение целиком."); return; }
      if (!d || typeof d !== "object" || !d.shifts) { alert("В тексте нет данных калькулятора."); return; }
      if (!confirm("Загрузить данные (" + Object.keys(d.shifts).length + " смен)? Текущие данные на этом телефоне будут заменены.")) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); location.reload();
    };
    pasteBtn.addEventListener("click", () => {
      if (navigator.clipboard && navigator.clipboard.readText) {
        navigator.clipboard.readText().then((t) => { if (t && t.indexOf("shifts") >= 0) importText(t); else { pasteBox.style.display = "block"; pasteTa.focus(); } },
          () => { pasteBox.style.display = "block"; pasteTa.focus(); });
      } else { pasteBox.style.display = "block"; pasteTa.focus(); }
    });
    pasteGo.addEventListener("click", () => importText(pasteTa.value));
    pasteBox.appendChild(pasteTa); pasteBox.appendChild(pasteGo);
    backup.appendChild(pasteBtn); backup.appendChild(pasteBox);
    backup.appendChild(el("div", { style:"font-size:10px;color:#334155;margin-top:10px;text-align:right", text:"версия приложения: 9" }));
    wrap.appendChild(backup);

    const resetBtn = el("button", { class:"reset-btn", text:"🗑️ Сбросить все данные", onclick: () => {
      if (confirm("Удалить все сохранённые смены и настройки?")) {
        localStorage.removeItem(STORAGE_KEY);
        state.shifts = {}; state.notes = {}; state.premium = 0; state.premiums = {}; state.extras = {}; state.hourlyRate = HOURLY_RATE;
        state.creditPoints = DEFAULT_CREDIT_POINTS; state.includePension = true; state.nofHagalil = false;
        state.pensionPct = DEFAULT_PENSION_PCT; state.keheshPct = DEFAULT_KEHESH_PCT; state.pensionCreditOn = true;
        render();
      }
    }});
    wrap.appendChild(resetBtn);

    app.appendChild(wrap);
  }

  // ── Auto-schedule modal ──
  if (state.showAutoModal) {
    app.appendChild(renderAutoModal());
  }

  if (state.sheetDay) app.appendChild(renderDaySheet());

  // ── BOTTOM BAR ──
  const bottomStats = computeStats();
  const bottomNet = computeNet(bottomStats);
  const bottomBar = el("div", { class:"bottom-bar" });
  bottomBar.appendChild(el("div", { class:"left", text: bottomStats.workDays + " смен · " + bottomStats.totalHours + "ч" }));
  const right = el("div", { class:"right" });
  right.appendChild(el("div", { id:"bottom-gross", class:"g", text:"брутто " + Math.round(bottomNet.gross).toLocaleString() + " ₪" }));
  right.appendChild(el("div", { id:"bottom-net",   class:"n", text: Math.round(bottomNet.net).toLocaleString() + " ₪ нетто" }));
  bottomBar.appendChild(right);
  app.appendChild(bottomBar);
}

// Обновляет только числа нетто-карточки без полного ре-рендера
function updateNetDisplay() {

  const net = computeNet(stats);

  const setTxt = (id, txt) => { const el = document.getElementById(id); if(el) el.textContent = txt; };

  setTxt("net-value",     Math.round(net.net).toLocaleString() + " ₪");

  setTxt("net-gross",     Math.round(net.gross).toLocaleString() + " ₪");
  setTxt("net-tax",       net.incomeTax === 0 ? "0 ₪" : "-" + Math.round(net.incomeTax).toLocaleString() + " ₪");
  setTxt("net-bituach",   "-" + Math.round(net.bituach).toLocaleString() + " ₪");

  setTxt("net-kehesh",    "-" + Math.round(net.kehesh).toLocaleString() + " ₪");
  setTxt("net-deductions","-" + Math.round(net.totalDeductions).toLocaleString() + " ₪");
  setTxt("bottom-gross",  "брутто " + Math.round(net.gross).toLocaleString() + " ₪");
  setTxt("bottom-net",    Math.round(net.net).toLocaleString() + " ₪ нетто");
  const y = computeYear();

}

// Lightweight refresh (legacy, kept for compatibility)
function refreshNetCardOnly() { updateNetDisplay(); }

function isoWeek(dt) {
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - y0) / 86400000 + 1) / 7);
}
const BASE_CHIPS = [["off","Выходной"],["morning","Утро 8"],["morning12","Утро 12"],["day","День 8"],["day12","День 12"],["night8","Ночь 8"],["night12","Ночь 12"]];
function openSheet(d) {
  state.sheetDay = d; state.sheetType = getShift(d).type; state.sheetNote = state.notes[key(d)] || ""; state.showBreakdown = false;
  render();
}
function closeSheet() { state.sheetDay = null; render(); }
function renderDaySheet() {
  const d = state.sheetDay;
  const ov = el("div", { class:"modal-overlay" });
  ov.addEventListener("click", (e) => { if (e.target === ov) closeSheet(); });
  const m = el("div", { class:"modal" });
  m.appendChild(el("div", { style:"width:40px;height:4px;background:#334155;border-radius:2px;margin:0 auto 12px" }));
  const dt = new Date(state.year, state.month, d);
  const wd = ["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"][dt.getDay()];
  const mGen = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"][state.month];
  m.appendChild(el("div", { class:"modal-title", text: wd + ", " + d + " " + mGen + (dt.getDay()===6 ? " ✡️" : "") }));
  const t = state.sheetType || "off";
  const r = calcShift(t, shabKind(state.year, state.month, d), state.hourlyRate);
  const sub = el("div", { class:"modal-sub", style:"cursor:pointer" , text: (t==="off" ? "Выходной" : SHIFT_TYPES[t].label.replace(/🌅|☀️|🌙|🔴/g,"").trim() + " · " + Math.round(r.total).toLocaleString() + " ₪" + (r.breakdown.length ? (state.showBreakdown ? "  ▲" : "  ▼ детали") : "")) });
  sub.addEventListener("click", () => { state.showBreakdown = !state.showBreakdown; render(); });
  m.appendChild(sub);
  if (state.showBreakdown && t !== "off") {
    const box = el("div", { class:"breakdown-box", style:"margin:-8px 0 12px" });
    r.breakdown.forEach(b => { const row = el("div", { class:"breakdown-row" });
      row.appendChild(el("span", { text:b.label, style:"color:#94a3b8" }));
      row.appendChild(el("span", { text: b.hrs + "ч × " + b.pct + "% = " + b.sum + " ₪", style:"color:#cbd5e1" })); box.appendChild(row); });
    m.appendChild(box);
  }
  m.appendChild(el("div", { class:"field-label", text:"Смена" }));
  const isTor = t.indexOf("tor_") === 0;
  const base = isTor ? t.slice(4) : t;
  const chips = el("div", { class:"sheet-chips" });
  BASE_CHIPS.forEach(([k, lab]) => {
    const c = el("button", { class:"schip" + (base===k ? " on" : ""), text: lab, style: k==="off" ? "" : "background:" + SHIFT_TYPES[k].color + ";color:#fff" });
    c.addEventListener("click", () => { state.sheetType = (isTor && k !== "off") ? "tor_" + k : k; render(); });
    chips.appendChild(c);
  });
  const torC = el("button", { class:"schip" + (isTor ? " on" : ""), text:"⚡ Торанута" + (isTor ? " ✓" : ""), style: isTor ? "background:#6d28d9;color:#fff" : "" });
  torC.addEventListener("click", () => { if (base === "off") return; state.sheetType = isTor ? base : "tor_" + base; render(); });
  chips.appendChild(torC);
  m.appendChild(chips);

  m.appendChild(el("div", { class:"field-label", text:"Заметка" }));
  const ta = el("textarea", { class:"note-ta", placeholder:"Например: 8:30 врач" });
  ta.value = state.sheetNote;
  ta.addEventListener("input", () => { state.sheetNote = ta.value; });
  m.appendChild(ta);
  const tags = el("div", { class:"qtags" });
  state.noteTags.forEach((tg, i) => {
    const b = el("button", { class:"qtag", text: tg });
    b.addEventListener("click", () => { state.sheetNote = (state.sheetNote.trim() ? state.sheetNote.trim() + " · " : "") + tg; ta.value = state.sheetNote; });
    let timer = null;   // долгое нажатие — удалить метку
    b.addEventListener("touchstart", () => { timer = setTimeout(() => { if (confirm("Удалить метку «" + tg + "»?")) { state.noteTags.splice(i, 1); saveData(); render(); } }, 700); }, { passive:true });
    b.addEventListener("touchend", () => clearTimeout(timer));
    tags.appendChild(b);
  });
  const add = el("button", { class:"qtag", text:"+ своя метка", style:"color:#34d399" });
  add.addEventListener("click", () => { const v = (prompt("Новая быстрая метка:") || "").trim(); if (v) { state.noteTags.push(v); saveData(); render(); } });
  tags.appendChild(add);
  m.appendChild(tags);

  const btns = el("div", { class:"sheet-btns" });
  const cancel = el("button", { text:"Отмена", style:"background:#334155;color:#94a3b8" });
  cancel.addEventListener("click", closeSheet);
  const save = el("button", { text:"Сохранить", style:"background:#059669;color:#fff" });
  save.addEventListener("click", () => {
    const k = key(d);
    state.shifts[k] = { type: state.sheetType || "off" };
    const n = state.sheetNote.trim();
    if (n) state.notes[k] = n; else delete state.notes[k];
    state.sheetDay = null; saveData(); render();
  });
  btns.appendChild(cancel); btns.appendChild(save);
  m.appendChild(btns);
  ov.appendChild(m);
  return ov;
}

// ── Смена месяца: стрелки и свайп влево/вправо по экрану ──
function changeMonth(dir) {
  state.month += dir;
  if (state.month < 0) { state.year--; state.month = 11; }
  if (state.month > 11) { state.year++; state.month = 0; }
  state.selected = new Set(); saveData(); render();
  const app = document.getElementById("app");
  if (app && app.animate) app.animate(
    [{ transform: "translateX(" + (dir > 0 ? 40 : -40) + "px)", opacity: 0.4 }, { transform: "translateX(0)", opacity: 1 }],
    { duration: 180, easing: "ease-out" });
}
(function () {
  let x0 = null, y0 = 0, t0 = 0;
  document.addEventListener("touchstart", (e) => {
    const t = e.target;
    if (e.touches.length !== 1 || state.showAutoModal || state.sheetDay || (t.closest && t.closest("input,textarea,select"))) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  document.addEventListener("touchend", (e) => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0;
    x0 = null;
    if (Date.now() - t0 > 700) return;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    changeMonth(dx < 0 ? 1 : -1);   // свайп влево — следующий месяц
  }, { passive: true });
})();

migratePremiums();
render();
</script>

<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function(){}); }

// Показать кнопку "Установить" когда браузер готов
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = `
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    width:calc(100% - 32px); max-width:448px;
    background:#0d9488; color:#fff; border-radius:12px;
    padding:12px 16px; display:flex; justify-content:space-between;
    align-items:center; z-index:999; box-shadow:0 4px 20px rgba(0,0,0,0.4);
    font-family:system-ui,sans-serif; font-size:14px;
  `;
  banner.innerHTML = `
    <div>
      <div style="font-weight:700">📲 Установить приложение</div>
      <div style="font-size:12px;opacity:0.85;margin-top:2px">Работает без интернета</div>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="installApp()" style="background:#fff;color:#0d9488;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px">Установить</button>
      <button onclick="document.getElementById('install-banner').remove()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:16px">✕</button>
    </div>
  `;
  document.body.appendChild(banner);
  // Автоскрыть через 10 сек
  setTimeout(() => { if (banner.parentNode) banner.remove(); }, 10000);
}

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      const b = document.getElementById('install-banner');
      if (b) b.remove();
    });
  }
}

// Если уже установлено — скрыть баннер
window.addEventListener('appinstalled', () => {
  const b = document.getElementById('install-banner');
  if (b) b.remove();
  deferredPrompt = null;
});
</script>
