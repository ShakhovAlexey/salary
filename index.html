<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin:0; padding:0; }
  html, body { background:#0f172a; color:#f1f5f9; font-family: system-ui, -apple-system, sans-serif; }
  html, body { overflow-x:hidden; }
  #pager { touch-action:pan-y; will-change:transform; }
  #app { max-width:480px; margin:0 auto; padding-bottom:90px; min-height:100vh; }

  .header { background:#1e293b; padding:14px 14px 10px; position:sticky; top:0; z-index:50; border-bottom:1px solid #334155; }
  .header-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .nav-btn { background:#334155; border:none; color:#f1f5f9; font-size:22px; width:36px; height:36px; border-radius:8px; cursor:pointer; }
  .month-title { text-align:center; }
  .month-title .name { font-size:17px; font-weight:700; }
  .month-title .rate { font-size:11px; color:#64748b; }

  .tabs { display:flex; gap:6px; }
  .tab-btn { flex:1; padding:7px 0; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:600; background:#334155; color:#94a3b8; }
  .tab-btn.active { background:#3b82f6; color:#fff; }
  .multi-btn { padding:7px 12px; border-radius:8px; border:none; cursor:pointer; font-size:13px; font-weight:600; background:#334155; color:#94a3b8; white-space:nowrap; }
  .multi-btn.active { background:#0f766e; color:#fff; }

  .bulk-bar { margin-top:10px; position:relative; }
  .bulk-row { display:flex; gap:6px; align-items:center; }
  .bulk-count { font-size:13px; color:#34d399; font-weight:700; min-width:70px; }
  .bulk-select-btn { flex:1; padding:8px 12px; border-radius:8px; border:1px solid #0d9488; background:#0f172a; color:#f1f5f9; font-size:13px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .bulk-clear { padding:8px 10px; border-radius:8px; border:none; background:#334155; color:#94a3b8; cursor:pointer; font-size:14px; }

  .dropdown { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:300; background:#1e293b; border-radius:12px; border:1px solid #334155; box-shadow:0 12px 40px rgba(0,0,0,0.8); overflow:hidden; max-height:360px; overflow-y:auto; }
  .dropdown-group-label { padding:8px 14px 4px; font-size:11px; font-weight:700; letter-spacing:0.8px; background:#0f172a; }
  .dropdown-item { padding:11px 16px; cursor:pointer; font-size:14px; border-bottom:1px solid #0f172a; display:flex; justify-content:space-between; align-items:center; color:#e2e8f0; }
  .dropdown-item:active { background:#334155; }
  .dropdown-item.selected { background:#1e3a8a; color:#fff; font-weight:700; }
  .dropdown-item .hrs-badge { font-size:12px; color:#8391a7; background:#0f172a; border-radius:6px; padding:1px 7px; }

  .day-headers { display:grid; grid-template-columns:repeat(7,1fr); padding:8px 6px 2px; }
  .day-header { text-align:center; font-size:11px; color:#8391a7; font-weight:600; padding-bottom:4px; }

  .cal-wrap { display:grid; grid-template-columns:18px repeat(7,1fr); gap:3px; padding:0 4px; }
  .cal-dh { text-align:center; font-size:11px; color:#64748b; font-weight:600; padding:6px 0 2px; }
  .wk-no { font-size:10px; color:#8391a7; display:flex; align-items:center; justify-content:center; }
  .cell2 { border-radius:8px; padding:3px 4px 4px; min-height:88px; cursor:pointer; overflow:hidden; color:#fff; position:relative; border:2px solid transparent; }
  .cell2 .top { display:flex; justify-content:space-between; align-items:center; }
  .cell2 .n { font-size:17px; font-weight:800; line-height:1.1; }
  .cell2 .ic { font-size:10px; opacity:.9; }
  .cell2 .sl { font-size:11px; font-weight:700; line-height:1.15; margin-top:1px; }
  .cell2 .am { font-size:10px; opacity:.85; }
  .cell2 .nt { margin-top:3px; font-size:10px; line-height:1.15; background:rgba(0,0,0,.3); border-radius:4px; padding:2px 3px; word-break:break-word;
               display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .cell2 .obs { font-size:9px; color:#bae6fd; line-height:1.1; margin-top:2px; }
  .cell2 .hol { font-size:9px; color:#fde68a; line-height:1.1; margin-top:2px; }
  .cell2.off { color:#64748b; } .cell2.off .sl { font-weight:400; font-size:10px; }
  .cell2.today { border-color:#34d399; }
  .cell2.sel { border-color:#22d3ee; transform:scale(.93); }
  .cell2.tor { border-color:#c4b5fd; }
  .msum { display:flex; gap:6px; padding:8px 6px 4px; }
  .msum div { flex:1; background:#1e293b; border-radius:9px; padding:5px 7px; font-size:10px; color:#64748b; }
  .msum b { display:block; font-size:14px; color:#e2e8f0; } .msum .nn b { color:#34d399; }
  .legend2 { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; font-size:11px; color:#94a3b8; padding:10px 6px; }
  .legend2 i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:-1px; }
  .sheet-chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  .schip { padding:9px 11px; border-radius:9px; font-size:13px; font-weight:600; background:#0f172a; color:#cbd5e1; border:2px solid transparent; cursor:pointer; }
  .schip.on { border-color:#818cf8; color:#fff; }
  .note-ta { width:100%; min-height:70px; background:#0f172a; border:1px solid #334155; border-radius:10px; padding:10px; font-size:15px; color:#e2e8f0; font-family:inherit; resize:vertical; }
  .qtags { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .qtag { font-size:12px; background:#0f172a; border-radius:14px; padding:6px 11px; color:#94a3b8; cursor:pointer; border:none; }
  .sheet-btns { display:flex; gap:8px; margin-top:14px; }
  .sheet-btns button { flex:1; padding:12px; border-radius:10px; border:none; font-weight:700; font-size:15px; cursor:pointer; }
  .cal-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:3px; padding:0 6px; }
  .cal-cell { border-radius:10px; padding:5px 3px; cursor:pointer; min-height:64px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; border:2px solid transparent; transition:transform .1s; }
  .cal-cell .num { font-size:12px; font-weight:700; color:#e2e8f0; }
  .cal-cell .lbl { font-size:9px; color:#94a3b8; text-align:center; line-height:1.3; }
  .cal-cell .sum { font-size:11px; font-weight:800; color:#34d399; }
  .cal-cell .dash { font-size:11px; color:#4b5563; }

  .day-panel { margin:12px 8px 0; background:#1e293b; border-radius:14px; padding:16px; border:1px solid #334155; }
  .day-panel-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .day-panel-title { font-weight:700; font-size:16px; }
  .close-btn { background:#334155; border:none; color:#94a3b8; border-radius:6px; padding:2px 8px; cursor:pointer; font-size:16px; }

  .field-label { font-size:12px; color:#64748b; margin-bottom:6px; }
  .shift-select-btn { width:100%; padding:11px 14px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:#f1f5f9; font-size:14px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center; position:relative; }

  .tor-badge { background:#2e1065; border:1px solid #7c3aed; border-radius:10px; padding:8px 12px; margin-bottom:12px; font-size:12px; color:#c4b5fd; }

  .breakdown-box { background:#0f172a; border-radius:10px; padding:12px; }
  .breakdown-row { display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-bottom:1px solid #1e293b; }
  .breakdown-row:last-child { border-bottom:none; }
  .breakdown-total { display:flex; justify-content:space-between; margin-top:10px; padding-top:10px; border-top:1px solid #334155; }

  .hint-box { margin:12px 8px 0; background:#0f2027; border-radius:12px; padding:12px 16px; border:1px solid #0d9488; font-size:13px; color:#5eead4; text-align:center; }

  .summary-padding { padding:12px 8px; }
  .gross-card { background:linear-gradient(135deg,#1e3a5f,#0f172a); border-radius:16px; padding:20px; margin-bottom:16px; border:1px solid #3b82f6; }
  .gross-card .label { font-size:13px; color:#94a3b8; margin-bottom:2px; }
  .gross-card .value { font-size:38px; font-weight:800; color:#34d399; }
  .gross-stats { display:flex; gap:20px; margin-top:12px; }
  .gross-stat { text-align:center; }
  .gross-stat .v { font-size:22px; font-weight:700; color:#60a5fa; }
  .gross-stat .l { font-size:11px; color:#64748b; }

  .section-label { font-size:11px; font-weight:700; color:#64748b; margin-bottom:6px; letter-spacing:1px; }

  .wk-box { background:#1e293b; border-radius:12px; overflow:hidden; margin-bottom:6px; }
  .wk-row { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid #0f172a; cursor:pointer; }
  .wk-row.open { background:#273449; }
  .wk-n { font-size:13px; font-weight:700; min-width:52px; }
  .wk-d { flex:1; font-size:11px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .wk-g { font-size:15px; font-weight:800; color:#34d399; }
  .wk-ar { width:12px; color:#64748b; font-size:12px; }
  .dy-row { display:flex; align-items:center; gap:8px; padding:7px 12px 7px 20px; background:#172033; border-bottom:1px solid #0f172a; font-size:12px; cursor:pointer; }
  .dy-dot { width:9px; height:9px; border-radius:3px; flex:none; }
  .dy-d { min-width:44px; color:#cbd5e1; font-weight:600; }
  .dy-s { flex:1; color:#94a3b8; }
  .dy-g { font-weight:700; color:#6ee7b7; }
  .dy-bd { display:flex; flex-wrap:wrap; gap:4px; padding:4px 12px 8px 37px; background:#172033; border-bottom:1px solid #0f172a; }
  .dy-bd span { font-size:11px; color:#94a3b8; background:#0f172a; border-radius:4px; padding:1px 6px; }
  .week-card { background:#1e293b; border-radius:12px; padding:12px 16px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; }
  .week-card .t { font-size:14px; font-weight:700; }
  .week-card .s { font-size:12px; color:#64748b; }
  .week-card .g { font-size:20px; font-weight:800; color:#34d399; }

  .day-card { background:#1e293b; border-radius:10px; padding:10px 14px; margin-bottom:5px; border-left:3px solid #3b82f6; }
  .day-card-row { display:flex; justify-content:space-between; align-items:center; }
  .day-card-bd { margin-top:5px; display:flex; flex-wrap:wrap; gap:4px; }
  .day-card-bd span { font-size:11px; color:#64748b; background:#0f172a; border-radius:4px; padding:1px 6px; }

  .net-card { background:linear-gradient(135deg,#064e3b,#0f172a); border-radius:16px; padding:20px; margin:16px 0; border:1px solid #10b981; }
  .net-card .label { font-size:13px; color:#6ee7b7; margin-bottom:2px; }
  .net-card .value { font-size:34px; font-weight:800; color:#34d399; }
  .net-row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .net-row.dim { color:#94a3b8; }
  .premium-input { width:90px; background:#0f172a; border:1px solid #134e3a; border-radius:6px; padding:3px 8px; color:#34d399; font-size:13px; font-weight:600; text-align:right; }

  .settings-card { background:#1e293b; border-radius:12px; padding:16px; margin-top:14px; }
  .settings-card .title { font-size:13px; font-weight:700; color:#94a3b8; margin-bottom:10px; }
  .num-input { width:100%; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:8px 12px; color:#f1f5f9; font-size:16px; }
  .toggle-btn { width:100%; padding:10px; border-radius:10px; border:none; cursor:pointer; font-size:13px; font-weight:600; background:#334155; color:#f1f5f9; display:flex; justify-content:center; align-items:center; gap:6px; }
  .toggle-btn.on { background:#0d9488; }
  .toggle-pill { background:#475569; border-radius:12px; padding:1px 8px; font-size:11px; }
  .toggle-pill.on { background:#0f766e; }

  .reset-btn { width:100%; margin-top:14px; padding:10px; border-radius:10px; border:1px solid #7f1d1d; background:transparent; color:#f87171; cursor:pointer; font-size:13px; font-weight:600; }

  .bottom-bar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:480px; background:#1e293b; border-top:1px solid #334155; padding:10px 20px; display:flex; justify-content:space-between; align-items:center; }
  .bottom-bar .left { font-size:13px; color:#64748b; }
  .bottom-bar .right { text-align:right; }
  .bottom-bar .right .g { font-size:11px; color:#64748b; }
  .bottom-bar .right .n { font-size:18px; font-weight:800; color:#34d399; }

  input[type=number]::-webkit-inner-spin-button { opacity: 1; }

  /* ── Auto-schedule modal ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:500; display:flex; align-items:flex-end; justify-content:center; }
  .modal { background:#1e293b; border-radius:20px 20px 0 0; padding:20px; width:100%; max-width:480px; max-height:85vh; overflow-y:auto; }
  .modal-title { font-size:16px; font-weight:700; margin-bottom:4px; }
  .modal-sub { font-size:12px; color:#64748b; margin-bottom:16px; }
  .cycle-block { background:#0f172a; border-radius:12px; padding:12px; margin-bottom:10px; position:relative; }
  .cycle-block-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .cycle-block-title { font-size:13px; font-weight:700; color:#94a3b8; }
  .del-block-btn { background:#7f1d1d; border:none; color:#fca5a5; border-radius:6px; padding:2px 8px; cursor:pointer; font-size:13px; }
  .cycle-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .cycle-row label { font-size:12px; color:#64748b; min-width:60px; }
  .cycle-input { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 10px; color:#f1f5f9; font-size:14px; width:60px; }
  .cycle-select { background:#1e293b; border:1px solid #334155; border-radius:8px; padding:6px 8px; color:#f1f5f9; font-size:13px; flex:1; }
  .add-block-btn { width:100%; padding:10px; border-radius:10px; border:2px dashed #334155; background:transparent; color:#64748b; cursor:pointer; font-size:13px; margin-bottom:14px; }
  .add-block-btn:active { border-color:#3b82f6; color:#60a5fa; }
  .start-row { display:flex; gap:8px; margin-bottom:14px; align-items:center; }
  .start-row label { font-size:13px; color:#94a3b8; white-space:nowrap; }
  .start-select { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:8px 10px; color:#f1f5f9; font-size:14px; flex:1; }
  .apply-btn { width:100%; padding:12px; border-radius:12px; border:none; background:#3b82f6; color:#fff; font-size:15px; font-weight:700; cursor:pointer; margin-bottom:8px; }
  .cancel-btn { width:100%; padding:10px; border-radius:12px; border:none; background:#334155; color:#94a3b8; font-size:14px; cursor:pointer; }
  .auto-btn { padding:7px 10px; border-radius:8px; border:none; cursor:pointer; font-size:12px; font-weight:600; background:#7c3aed; color:#fff; white-space:nowrap; }

  /* ── Дизайн-система: токены, сетка 8pt, касание ≥44px ── */
  :root { --bg:#0b1120; --surface:#151e30; --surface-2:#1e293b; --line:#26324a; --text:#e5e9f0; --muted:#94a3b8; --subtle:#64748b;
          --accent:#60a5fa; --accent-bg:#1d3a6b; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --r:16px; }
  html, body { background:var(--bg); color:var(--text); }
  body { font-family:-apple-system, "Segoe UI", Roboto, system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  #app { padding-bottom:calc(84px + env(safe-area-inset-bottom)); }
  .header { background:rgba(11,17,32,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); border-bottom:1px solid var(--line);
            padding:calc(8px + env(safe-area-inset-top)) 8px 8px; }
  .header-top { margin-bottom:0; min-height:52px; }
  .nav-btn { background:transparent; width:44px; height:44px; border-radius:22px; font-size:26px; color:var(--muted); }
  .nav-btn:active { background:var(--surface-2); }
  .month-title .name { font-size:18px; font-weight:700; letter-spacing:.2px; }
  .month-title .sub { font-size:13px; color:var(--ok); font-weight:600; margin-top:2px; font-variant-numeric:tabular-nums; }
  .cal-actions { display:flex; gap:8px; justify-content:center; padding-top:8px; }
  .chip-btn { min-height:36px; padding:0 16px; border-radius:18px; border:1px solid var(--line); background:var(--surface); color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; }
  .chip-btn.active { background:#0f766e; border-color:#0f766e; color:#fff; }
  .bottom-bar { padding:6px 4px calc(6px + env(safe-area-inset-bottom)); background:rgba(15,22,38,.96); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
                border-top:1px solid var(--line); display:flex; justify-content:space-around; z-index:60; }
  .nav-item { flex:1; background:none; border:none; color:var(--subtle); display:flex; flex-direction:column; align-items:center; gap:2px; padding:4px 0; min-height:56px; cursor:pointer; }
  .nav-ico { width:56px; height:30px; border-radius:15px; display:flex; align-items:center; justify-content:center; transition:background .2s; }
  .nav-lab { font-size:11px; font-weight:600; }
  .nav-item.active { color:var(--text); }
  .nav-item.active .nav-ico { background:var(--accent-bg); color:var(--accent); }
  .summary-padding { padding:12px 12px 8px; }
  .section-h { font-size:12px; font-weight:700; color:var(--subtle); text-transform:uppercase; letter-spacing:.08em; margin:20px 4px 8px; }
  .section-h:first-child { margin-top:4px; }
  .settings-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-top:12px; }
  .section-h + .settings-card { margin-top:0; }
  .settings-card .title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:12px; }
  .field-label { font-size:13px; color:var(--muted); margin-bottom:6px; }
  .num-input { min-height:44px; border-radius:10px; background:var(--bg); border-color:var(--line); }
  .num-input:focus { outline:none; border-color:var(--accent); }
  .toggle-btn { min-height:48px; border-radius:12px; font-size:14px; background:var(--surface-2); justify-content:space-between; padding:10px 14px; }
  .toggle-btn:not(:has(.toggle-pill)) { justify-content:center; }
  .primary-btn { display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; border-radius:12px; border:none; background:#2563eb; color:#fff; font-size:15px; font-weight:700; cursor:pointer; text-decoration:none; }
  .primary-btn:active { background:#1d4ed8; }
  .hint { font-size:12px; color:var(--subtle); margin-top:8px; line-height:1.4; }
  .reset-btn { margin-top:12px; min-height:48px; border-radius:12px; }
  .gross-card, .net-card { border-radius:var(--r); }
  .gross-card { margin-bottom:12px; }
  .net-card { margin:12px 0; }
  button:focus-visible, a:focus-visible, input:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  .chart { margin-top:4px; }
  .chart svg { display:block; overflow:visible; }
  .chart-tip { font-size:12px; color:var(--muted); min-height:18px; margin-top:4px; font-variant-numeric:tabular-nums; }
  .insight { margin-top:14px; padding:12px; border-radius:12px; background:#0f2a22; border:1px solid #14532d; color:#d1fae5; font-size:13px; line-height:1.45; }
  .cmp { font-size:13px; font-variant-numeric:tabular-nums; }
  .cmp-row { display:grid; grid-template-columns:1.5fr 1fr 1fr .8fr; gap:6px; padding:8px 0; border-bottom:1px solid var(--line); align-items:center; }
  .cmp-row span:not(:first-child) { text-align:right; }
  .cmp-h { color:var(--subtle); font-size:12px; font-weight:700; }
  .cmp-row .up { color:var(--ok); } .cmp-row .down { color:var(--bad); }
  .mtable { margin-top:10px; font-size:12px; font-variant-numeric:tabular-nums; }
  .mt-row { display:grid; grid-template-columns:1.1fr .6fr .6fr .8fr .9fr 1fr; gap:4px; padding:6px 0; border-bottom:1px solid var(--line); }
  .mt-row span:not(:first-child) { text-align:right; }

<script>
// ───────────────────────── CONFIG ─────────────────────────
const HOURLY_RATE = 44;
const DEFAULT_CREDIT_POINTS = 2.25;   // для нового пользователя: гражданин-мужчина; своё значение — из листка
const POINT_VALUE_2026 = 242;         // ₪ в месяц за 1 балл
const DEFAULT_PENSION_PCT = 6;        // пенсия, % с оплаты за смены
const DEFAULT_KEHESH_PCT  = 2.5;      // керен иштальмут, %
const NOF_HAGALIL_RATE = 0.12;        // скидка жителей Ноф-ха-Галиль (пресет)
const NOF_HAGALIL_CEILING_YEAR = 226560; // годовой потолок дохода для скидки (пресет)
const PENSION_CREDIT_RATE = 0.35;     // зачёт по ст. 45א с взносов работника
const STORAGE_KEY = "salary_calc_v1";

// Ступени подоходного налога 2026 (трудовой доход): [верхняя граница, ставка]
const BRACKETS_MONTH = [[7010,.10],[10060,.14],[19000,.20],[25100,.31],[46690,.35],[Infinity,.47]];
const BRACKETS_YEAR  = [[84120,.10],[120720,.14],[228000,.20],[301200,.31],[560280,.35],[Infinity,.47]];
function bracketTax(g, table) {
  let prev = 0, t = 0;
  for (let i = 0; i < table.length; i++) {
    const lim = table[i][0], r = table[i][1];
    if (g > prev) t += (Math.min(g, lim) - prev) * r;
    prev = lim;
  }
  return t;
}
// Подоходный налог за месяц: ступени − баллы − скидка жителя − зачёт за пенсию
function calcIncomeTax(g, creditPts, benefitOn, benefitPct, benefitCeilMonth, pensionCredit) {
  const raw = bracketTax(g, BRACKETS_MONTH);
  const pts = (Number(creditPts) || 0) * POINT_VALUE_2026;
  const ben = benefitOn ? Math.min(g, benefitCeilMonth) * (benefitPct / 100) : 0;
  return Math.max(0, raw - pts - ben - (pensionCredit || 0));
}
// Битуах Леуми + мас бриут (работник), 2026: до 7 703 ₪ — 1.04%+3.23%, выше — 7%+5.17% (сверено с листком за июнь)
const BL_THRESHOLD = 7703;
function calcBituachLeumi(g) {
  const t = BL_THRESHOLD;
  if (g <= t) return g * 0.0427;
  return t*0.0427 + (g-t)*0.1217;
}

const SHIFT_TYPES = {
  morning:          { label: "🌅 Утро 8ч",            hours: 8,  group: "regular",   color:"#ea580c" },
  morning12:        { label: "🌅 Утро 12ч",           hours: 12, group: "regular",   color:"#c2410c" },
  day:              { label: "☀️ День 8ч",            hours: 8,  group: "regular",   color:"#2563eb" },
  day12:            { label: "☀️ День 12ч",           hours: 12, group: "regular",   color:"#1d4ed8" },
  night8:           { label: "🌙 Ночь 8ч",            hours: 8,  group: "regular",   color:"#3730a3" },
  night12:          { label: "🌙 Ночь 12ч",           hours: 12, group: "regular",   color:"#312e81" },
  tor_morning:      { label: "⚡ Тор. Утро 8ч",       hours: 8,  group: "torranuta", color:"#ea580c" },
  tor_morning12:    { label: "⚡ Тор. Утро 12ч",      hours: 12, group: "torranuta", color:"#c2410c" },
  tor_day:          { label: "⚡ Тор. День 8ч",       hours: 8,  group: "torranuta", color:"#2563eb" },
  tor_day12:        { label: "⚡ Тор. День 12ч",      hours: 12, group: "torranuta", color:"#1d4ed8" },
  tor_night8:       { label: "⚡ Тор. Ночь 8ч",       hours: 8,  group: "torranuta", color:"#3730a3" },
  tor_night12:      { label: "⚡ Тор. Ночь 12ч",      hours: 12, group: "torranuta", color:"#312e81" },
  vac:              { label: "🏖 Отпуск (оплач.)",       hours: 0,  group: "vac",       color:"#0e7490" },
  off:              { label: "🔴 Выходной",             hours: 0,  group: "off",       color:"#1e293b" },
};

function baseType(t) {
  if (t.startsWith("tor_")) return t.slice(4); // tor_night8 → night8
  return t;
}

// ── Параметры смен: старт (час суток), длительность, класс тарифа ──────────
// Класс определяет базовый коэффициент по номеру отработанного часа:
//   morning (старт до 14:00): 1-8ч 100%, 9-10ч 125%, 11+ч 150%
//   day     (вечерняя):       1-8ч 117.5%, 9-10ч 125%, 11+ч 150%
//   night:                    1-7ч 140%, 8-9ч 175%, 10+ч 210%
// В шабат (пт с 17:00 до сб 17:00) коэффициент удваивается: 100→200, 117.5→235,
// 125→250, 140→280, 150→300, 175→350, 210→420 (проверено по табелям июнь-август).
const SHIFT_SPEC = {
  morning:   { start: 6,   hours: 8,  cls: "morning" },
  morning12: { start: 6,   hours: 12, cls: "morning" },
  day:       { start: 14,  hours: 8,  cls: "day" },
  day12:     { start: 9.5, hours: 12, cls: "morning" },   // по табелям: вход ~09:30, тариф как у утра
  night8:    { start: 22,  hours: 8,  cls: "night" },
  night12:   { start: 22,  hours: 12, cls: "night" }
};
const SHABBAT_START = 17;          // пятница, час суток
const SHABBAT_END   = 24 + 17;     // суббота 17:00, часов от полуночи пятницы

function baseCoef(cls, workedHours) {
  if (cls === "night") return workedHours < 7 ? 140 : (workedHours < 9 ? 175 : 210);
  const first = cls === "day" ? 117.5 : 100;
  return workedHours < 8 ? first : (workedHours < 10 ? 125 : 150);
}

// kind: false | "fri" | "sat" — на какой день недели начинается смена
function calcShift(type, kind, rate) {
  rate = rate || HOURLY_RATE;
  if (type === "off" || !type) return { total: 0, breakdown: [] };
  // Оплачиваемый день отпуска (код 110 «חופש»): 8ч × ставка, входит в базу пенсии и керен
  if (type === "vac") { const v = Math.round(8 * (rate || HOURLY_RATE) * 100) / 100; return { total: v, regular: v, breakdown: [{ label:"🏖 Отпуск 100%", hrs: 8, pct: 100, sum: v }] }; }
  if (kind === true) kind = "sat";
  if (kind === "fri") kind = { h0:false, h1:true, h2:false };
  else if (kind === "sat") kind = { h0:true, h1:false, h2:false };
  else if (!kind) kind = { h0:false, h1:false, h2:false };
  const holyAt = (c) => { const off = Math.floor(c / 24), hr = c - off * 24;
    const H = [kind.h0, kind.h1, kind.h2, false];
    return (H[off] && hr < SHABBAT_START) || (H[off + 1] && hr >= SHABBAT_START); };
  const def = SHIFT_TYPES[type];
  const isTor = def && def.group === "torranuta";
  const base = baseType(type);
  const spec = SHIFT_SPEC[base];
  if (!spec) return { total: 0, breakdown: [] };

  // считаем по получасовым отрезкам
  const groups = {};   // ключ: pct|shab → часы
  const order = [];
  const STEP = 0.5;
  for (let k = 0; k < spec.hours / STEP; k++) {
    const worked = k * STEP;
    const clock = spec.start + worked + STEP / 2;      // середина отрезка
    const shab = holyAt(clock);
    const basePct = baseCoef(spec.cls, 0) * (shab ? 2 : 1);
    const pct = baseCoef(spec.cls, worked) * (shab ? 2 : 1);
    const gk = pct + "|" + (shab ? 1 : 0);
    if (!(gk in groups)) { groups[gk] = { pct: pct, shab: shab, hrs: 0, reg: pct === basePct }; order.push(gk); }
    groups[gk].hrs += STEP;
  }
  const breakdown = [];
  let total = 0, regular = 0;
  order.forEach(function (gk) {
    const g = groups[gk];
    const sum = Math.round(g.hrs * rate * g.pct / 100 * 100) / 100;
    breakdown.push({
      label: (g.shab ? "✡️ שבת " : "") + g.pct + "%",
      hrs: g.hrs, pct: g.pct, sum: sum
    });
    total += sum;
    if (g.reg) regular += sum;
  });

  // ── ТОРРАНУТА: надбавка (коды 132/133/134/136 = 50/58.8/70/117.5%) за 8ч × ставка.
  if (isTor) {
    // Авто: код надбавки зависит от смены: утро 50%, вечер 58.8%, ночь 70%,
    // шабат (сб до 17:00 / пт ночь) 117.5% — по листкам июня-августа
    let autoPct = spec.cls === "night" ? 70 : (spec.cls === "day" ? 58.8 : 50);
    // в шабат/праздник надбавка вдвое: утро 100%, день 117.5%, ночь 140% (коды 135/136/137 в листках мая и июля)
    if (holyAt(spec.start + 0.25)) autoPct = spec.cls === "night" ? 140 : (spec.cls === "day" ? 117.5 : 100);
    const manual = (typeof state !== "undefined" && state.torAuto === false);
    const torPct = manual ? (state.torPct || 58.8) : autoPct;
    const torBonus = Math.round(8 * rate * torPct / 100 * 100) / 100;
    breakdown.push({ label: "⚡ Тор. надбавка (" + torPct + "%×8ч)", hrs: 8, pct: torPct, sum: torBonus });
    total += torBonus;
  }
  return { total: Math.round(total*100)/100, regular: Math.round(regular*100)/100, breakdown: breakdown };
}

// Частичный файл (сверка по листкам): заменяет только перечисленные месяцы, остальное не трогает
function mergePartial(d) {
  const months = d.partialMonths || [];
  months.forEach(ym => {
    Object.keys(state.shifts).forEach(k => { if (k.indexOf(ym) === 0) delete state.shifts[k]; });
    Object.keys(d.shifts || {}).forEach(k => { if (k.indexOf(ym) === 0) state.shifts[k] = d.shifts[k]; });
    ["premiums","extras","zkifotM","ratesM","hbM","refM","recupM","taxM","netM"].forEach(f => { if (d[f] && d[f][ym] !== undefined) { state[f] = state[f] || {}; state[f][ym] = d[f][ym]; } });
    Object.keys(d.notes || {}).forEach(k => { if (k.indexOf(ym) === 0) state.notes[k] = d.notes[k]; });
  });
  if (d.settings) Object.keys(d.settings).forEach(k => { state[k] = d.settings[k]; });
  saveData();
}
function migratePremiums() {
  if (state.premiums) return;
  state.premiums = {};
  Object.keys(state.shifts).forEach(k => { const ym = k.slice(0,7); if (!(ym in state.premiums)) state.premiums[ym] = Number(state.premium) || 0; });
  saveData();
}
const HE_DAYS = ["вс","пн","вт","ср","чт","пт","сб"];
const MONTHS_RU = ["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
function isSabbath(y,m,d){ return new Date(y,m,d).getDay()===6; }

const toNum = (v) => Number(String(v).replace(",", ".")) || 0;

// Премия и разовые выплаты — свои для каждого месяца
function getPremium() { const v = state.premiums[ymKey()]; return v !== undefined ? (Number(v)||0) : (Number(state.premium)||0); }
// Данные из листка по месяцам (ставка, бонус 167, хавраа 160, налог, нетто для сверки)
const mget = (f) => { const o = state[f]; const v = o ? o[ymKey()] : undefined; return (v === undefined || v === null || v === "") ? undefined : Number(v); };
function curRate() { const r = mget("ratesM"); return r !== undefined ? r : state.hourlyRate; }
function getExtras() { return Number(state.extras[ymKey()]) || 0; }
function getShift(d) { return state.shifts[key(d)] || { type: "off" }; }

function computeStats() {
  const daysInMonth = getDaysInMonth(state.year, state.month);
  const firstDay = getFirstDay(state.year, state.month);
  let totalGross=0, totalHours=0, workDays=0, regularPay=0;
  const weekly = {};
  for (let d=1; d<=daysInMonth; d++) {
    const sh = getShift(d);
    if (sh.type === "off") continue;
    const sab = isSabbath(state.year, state.month, d);
    const r = calcShift(sh.type, shabKind(state.year, state.month, d), curRate());
    const h = (SHIFT_TYPES[sh.type] && SHIFT_TYPES[sh.type].hours) || 0;
    totalGross += r.total; regularPay += r.regular || 0;
    if (sh.type === "vac") continue;      // отпуск: деньги есть, часов и смены нет
    totalHours += h; workDays++;
    const wn = Math.ceil((d+firstDay)/7);
    if (!weekly[wn]) weekly[wn] = { gross:0, hours:0, days:0 };
    weekly[wn].gross += r.total; weekly[wn].hours += h; weekly[wn].days++;
  }
  return { totalGross: Math.round(totalGross*100)/100, regularPay: Math.round(regularPay*100)/100, totalHours, workDays, weekly };
}

// Бонус за часы в месяце (код 167 в листке): 200–220 ч → hb1, 221–240 ч → hb2. Пенсия с него не удерживается (сверено с июнем).
function calcHoursBonus(h) {
  if (state.hoursBonusOn === false) return 0;
  if (h > 220) return Number(state.hb2) || 0;
  if (h >= 200) return Number(state.hb1) || 0;
  return 0;
}
function computeNet(stats) {
  const shiftsGross = stats.totalGross;
  const premium = getPremium(), extras = getExtras();
  const hbm = mget("hbM");
  const hoursBonus = hbm !== undefined ? hbm : calcHoursBonus(stats.totalHours || 0);
  const recup = mget("recupM") || 0;
  const referral = mget("refM") || 0;        // код 167: вознаграждение за приведённого работника          // דמי הבראה (код 160): в пенсию идёт, в керен нет
  const gross = shiftsGross + premium + extras + hoursBonus + recup + referral;
  const zm = state.zkifotM && state.zkifotM[ymKey()];
  const zkifot = zm !== undefined ? (Number(zm) || 0) : (Number(state.zkifot) || 0);      // условные начисления: облагаются, но не выплачиваются
  const taxBase = gross + zkifot;
  // По листку: пенсия — с обычной оплаты смен (без переработки и надбавок) + премия; керен — только с обычной оплаты
  const regular = stats.regularPay !== undefined ? stats.regularPay : shiftsGross;
  const pension = state.includePension ? (regular + premium + recup) * (Number(state.pensionPct)||0) / 100 : 0;
  const kehesh  = state.includePension ? regular * (Number(state.keheshPct)||0) / 100 : 0;
  const bituach = calcBituachLeumi(taxBase);
  const pensionCredit = (state.includePension && state.pensionCreditOn) ? pension * PENSION_CREDIT_RATE : 0;
  const ceilMonth = (Number(state.benefitCeilYear)||0) / 12;
  const taxOv = mget("taxM");
  const incomeTax = taxOv !== undefined ? taxOv : calcIncomeTax(taxBase, state.creditPoints, state.nofHagalil, Number(state.benefitPct)||0, ceilMonth, pensionCredit);
  const totalDeductions = incomeTax + bituach + pension + kehesh;
  const net = gross - totalDeductions;
  const rawTax = bracketTax(taxBase, BRACKETS_MONTH);
  const pointsShield = (Number(state.creditPoints)||0) * POINT_VALUE_2026;
  const nofShield = state.nofHagalil ? Math.min(taxBase, ceilMonth) * (Number(state.benefitPct)||0) / 100 : 0;
  return { shiftsGross, premium, extras, hoursBonus, referral, recup, taxOverride: taxOv !== undefined, taxBase, gross, pension, kehesh, bituach, incomeTax, rawTax, pointsShield, nofShield, pensionCredit, totalDeductions, net };
}

// Годовой прогноз налога по всем введённым месяцам года (годовые ступени)
function computeYear() {
  const m0 = state.month;
  let T = 0, months = 0, monthlySum = 0, pensionSum = 0;
  try {
    for (let m = 0; m < 12; m++) {
      state.month = m;
      const st = computeStats();
      if (st.workDays === 0) continue;
      const n = computeNet(st);
      T += n.taxBase; monthlySum += n.incomeTax; pensionSum += n.pension; months++;
    }
  } finally { state.month = m0; }
  const raw = bracketTax(T, BRACKETS_YEAR);
  const pts = (Number(state.creditPoints)||0) * POINT_VALUE_2026 * 12;
  const ben = state.nofHagalil ? Math.min(T, Number(state.benefitCeilYear)||0) * (Number(state.benefitPct)||0) / 100 : 0;
  const pc = (state.includePension && state.pensionCreditOn) ? pensionSum * PENSION_CREDIT_RATE : 0;
  const tax = Math.max(0, raw - pts - ben - pc);
  return { T, months, tax, monthlySum };
}

// ───────────────────────── CYCLE SCHEDULE ─────────────────────────
function applyCycle(startYear, startMonth, startDay, monthsAhead) {
  // Build flat cycle array from template
  const cycle = [];
  state.cycleTemplate.forEach(block => {
    for (let i = 0; i < block.count; i++) {
      cycle.push(block.isOff ? "off" : block.type);
    }
  });
  if (!cycle.length) return;

  // Start from given date
  let y = startYear, m = startMonth, d = startDay;
  const endYear  = startMonth + monthsAhead > 11 ? startYear + Math.floor((startMonth + monthsAhead)/12) : startYear;
  const endMonth = (startMonth + monthsAhead) % 12;

  // Don't overwrite beyond end boundary
  const pastEnd = (cy, cm) => {
    if (cy > endYear) return true;
    if (cy === endYear && cm > endMonth) return true;
    return false;
  };

  let cycleIdx = 0;
  while (!pastEnd(y, m)) {
    const dim = getDaysInMonth(y, m);
    while (d <= dim && !pastEnd(y, m)) {
      const k = y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
      state.shifts[k] = { type: cycle[cycleIdx % cycle.length] };
      cycleIdx++;
      d++;
    }
    d = 1;
    m++;
    if (m > 11) { m = 0; y++; }
  }
  saveData();
}

function el(tag, attrs, children) {

  return e;
}

function isoWeek(dt) {
  const d = new Date(Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil(((d - y0) / 86400000 + 1) / 7);
}
const BASE_CHIPS = [["off","Выходной"],["vac","🏖 Отпуск"],["morning","Утро 8"],["morning12","Утро 12"],["day","День 8"],["day12","День 12"],["night8","Ночь 8"],["night12","Ночь 12"]];
// ── Умный планировщик: как добрать до цели нетто ──
// Правила: не больше 7 рабочих дней подряд; к любой 8-часовой смене можно добавить 4 часа (→ 12ч);
// в выходной можно выйти на доп. смену (оплачивается как торанута — надбавка за смену в выходной).
const EXTEND_TO = { morning:"morning12", day:"day12", night8:"night12", tor_morning:"tor_morning12", tor_day:"tor_day12", tor_night8:"tor_night12" };
const EXTRA_OPTIONS = ["tor_morning","tor_day","tor_night8","tor_morning12","tor_day12","tor_night12"];
function netFor(shifts) {
  const keep = state.shifts; state.shifts = shifts;
  try { return computeNet(computeStats()).net; } finally { state.shifts = keep; }
}
function isWorkKey(shifts, dt) { const s = shifts[dkey(dt.getFullYear(), dt.getMonth(), dt.getDate())]; return !!(s && s.type && s.type !== "off" && s.type !== "vac"); }
function runIfWork(shifts, y, m, d) {
  let run = 1;
  for (let i = 1; i < 30 && isWorkKey(shifts, new Date(y, m, d - i)); i++) run++;
  for (let i = 1; i < 30 && isWorkKey(shifts, new Date(y, m, d + i)); i++) run++;
  return run;
}
function planExtra(goal) {
  const y = state.year, m = state.month, dim = getDaysInMonth(y, m);
  const now = new Date();
  let fromDay = 1;
  if (y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth())) return { error:"Этот месяц уже прошёл." };
  if (y === now.getFullYear() && m === now.getMonth()) fromDay = now.getDate() + 1;
  const plan = JSON.parse(JSON.stringify(state.shifts));
  const startNet = netFor(plan);
  const cap = Number(state.maxHours) || 240;
  let hrsNow = 0;
  for (let d = 1; d <= dim; d++) { const s0 = plan[dkey(y, m, d)]; if (s0 && SHIFT_TYPES[s0.type]) hrsNow += SHIFT_TYPES[s0.type].hours; }
  const startHours = hrsNow;
  let cur = startNet;
  const steps = [];
  for (let guard = 0; guard < 62 && cur < goal; guard++) {
    let best = null;
    for (let d = fromDay; d <= dim; d++) {
      const k = dkey(y, m, d), t = (plan[k] && plan[k].type) || "off";
      const kind = shabKind(y, m, d);
      const curPay = calcShift(t, kind, curRate()).total;
      let opts = [];
      if (t === "off") {
        if (runIfWork(plan, y, m, d) > 7) continue;
        opts = EXTRA_OPTIONS.map(nt => ({ nt, hrs: SHIFT_TYPES[nt].hours, what:"доп. смена" }));
      } else if (EXTEND_TO[t]) {
        opts = [{ nt: EXTEND_TO[t], hrs: 4, what:"+4 часа" }];
      }
      opts.forEach(o => {
        if (hrsNow + o.hrs > cap) return;   // не больше лимита часов в месяц
        const gain = calcShift(o.nt, kind, curRate()).total - curPay;
        const score = gain / o.hrs;
        if (gain > 0 && (!best || score > best.score)) best = { d, k, from: t, to: o.nt, hrs: o.hrs, what: o.what, gross: gain, score };
      });
    }
    if (!best) break;
    // если до цели нужно немного, а лучший вариант — целая 12-часовая смена, берём 8-часовую
    plan[best.k] = { type: best.to }; hrsNow += best.hrs;
    const n2 = netFor(plan);
    best.net = n2 - cur; cur = n2;
    steps.push(best);
  }
  steps.sort((a, b) => a.d - b.d);
  return { steps, plan, startNet, endNet: cur, reached: cur >= goal, hours: steps.reduce((a, x) => a + x.hrs, 0), startHours, endHours: hrsNow, cap, capHit: hrsNow + 4 > cap };
}

function shiftMonth(dir) {

let sliding = false;
// Плавная смена месяца: старая страница уезжает, новая въезжает с той стороны
function changeMonth(dir, fromX) {
  if (sliding) return;
  const pg = document.getElementById("pager");
  const W = window.innerWidth || 400;
  if (!pg) { shiftMonth(dir); render(); return; }
  sliding = true;
  pg.style.transition = "transform 150ms cubic-bezier(.4,0,1,1)";

  setTimeout(() => {

    np.style.transform = "translateX(" + (dir > 0 ? W : -W) * 0.5 + "px)";

    np.style.transition = "transform 240ms cubic-bezier(.2,.8,.2,1)";

(function () {
  let x0 = null, y0 = 0, t0 = 0, drag = false, dx = 0;
  const pager = () => document.getElementById("pager");
  document.addEventListener("touchstart", (e) => {
    const t = e.target;
    if (sliding || (state.view !== "calendar" && state.view !== "salary") || e.touches.length !== 1 || state.showAutoModal || state.sheetDay || state.showWizard || state.showPlanner || state.showMonthPicker ||
        (t.closest && (t.closest("input,textarea,select") || t.closest(".header") || !t.closest("#pager")))) { x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now(); drag = false; dx = 0;
  }, { passive: true });
  document.addEventListener("touchmove", (e) => {

    dx = e.touches[0].clientX - x0; const dy = e.touches[0].clientY - y0;
    if (!drag) {

    }
    const p = pager(); if (p) { p.style.transition = "none"; p.style.transform = "translateX(" + dx + "px)"; }

  document.addEventListener("touchend", () => {
    if (x0 === null) return;
    x0 = null;
    if (!drag) return;
    const v = Math.abs(dx) / Math.max(1, Date.now() - t0);   // px/мс
    const p = pager();
    if (Math.abs(dx) > 70 || (Math.abs(dx) > 30 && v > 0.4)) changeMonth(dx < 0 ? 1 : -1);
    else if (p) { p.style.transition = "transform 200ms cubic-bezier(.2,.8,.2,1)"; p.style.transform = "translateX(0)"; }
  }, { passive: true });
})();

// ── Импорт смен из приложения «Шаги» (по геолокации «Работа») ──
// Тип смены — по времени прихода, как в табеле: утро ~06:00, день 12ч ~09:30, день ~14:00, ночь ~22:00.
// Часы целые; 11+ ч — двенадцатичасовая смена. Торанут «Шаги» не знают — если день уже был торанутом, он сохраняется.
function stepsShiftType(e, h) {
  if (e >= 4.5 && e < 7) return h >= 11 ? "morning12" : "morning";
  if (e >= 8.5 && e < 11.5) return "day12";
  if (e >= 11.5 && e < 16) return h >= 11 ? "day12" : "day";
  if (e >= 16 && e < 20) return "night12";
  if (e >= 20 && e < 23.5) return h >= 11 ? "night12" : "night8";
  return null;
}

  history.replaceState(null, "", location.pathname + location.search);
  let data;
  try { data = JSON.parse(decodeURIComponent(m[1])); } catch (e) { alert("Не удалось прочитать данные из «Шагов»."); return; }
  if (!data || data.source !== "steps" || !Array.isArray(data.sessions)) return;
  const res = {}, hrs = {}, unknown = [];
  data.sessions.forEach(function (s) {
    const p = String(s.start || "").split(":").map(Number);
    if (p.length < 2 || isNaN(p[0])) { unknown.push(s.date); return; }
    const t = stepsShiftType(p[0] + p[1] / 60, Number(s.hours) || 0);
    if (!t) { unknown.push(s.date + " (" + s.start + ")"); return; }
    const prev = state.shifts[s.date];
    res[s.date] = (prev && prev.type && prev.type.indexOf("tor_") === 0) ? "tor_" + t : t;
    hrs[s.date] = s.hours;
  });
  const keys = Object.keys(res).sort();
  if (!keys.length) { alert("В данных из «Шагов» нет смен." + (unknown.length ? "\nНе распознаны: " + unknown.join(", ") : "")); return; }
  const changed = keys.filter(function (k) { return !state.shifts[k] || state.shifts[k].type !== res[k]; });
  const lines = keys.map(function (k) {
    return k.slice(8) + "." + k.slice(5, 7) + " — " + shiftLabel(res[k]) + " (" + hrs[k] + " ч)" + (changed.indexOf(k) >= 0 ? "  ← новое" : "");
  });
  const msg = "Смены из «Шагов» (по геолокации):\n" + lines.join("\n") +
    (unknown.length ? "\n\nНе распознаны: " + unknown.join(", ") : "") +
    "\n\nИзменится дней: " + changed.length + ". Записать в календарь?";
  if (!changed.length) { alert("Все смены из «Шагов» уже стоят в календаре."); return; }
  if (!confirm(msg)) return;
  keys.forEach(function (k) { state.shifts[k] = { type: res[k] }; });
  const f = keys[keys.length - 1];
  state.year = +f.slice(0, 4); state.month = +f.slice(5, 7) - 1; state.view = "calendar";
  saveData(); render();
}
window.addEventListener("hashchange", function () { setTimeout(importFromSteps, 100); });

if (state.view === "summary") state.view = "salary";
migratePremiums();
render();
if (IN_APP) setTimeout(syncApp, 500);
setTimeout(importFromSteps, 300);
</script>

<!-- PWA Service Worker -->
<script>
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(function(){}); }

// Показать кнопку "Установить" когда браузер готов
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  showInstallBanner();
});

function showInstallBanner() {
  if (document.getElementById('install-banner')) return;
  const banner = document.createElement('div');
  banner.id = 'install-banner';
  banner.style.cssText = `
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
    width:calc(100% - 32px); max-width:448px;
    background:#0d9488; color:#fff; border-radius:12px;
    padding:12px 16px; display:flex; justify-content:space-between;
    align-items:center; z-index:999; box-shadow:0 4px 20px rgba(0,0,0,0.4);
    font-family:system-ui,sans-serif; font-size:14px;
  `;
  banner.innerHTML = `
    <div>
      <div style="font-weight:700">📲 Установить приложение</div>
      <div style="font-size:12px;opacity:0.85;margin-top:2px">Работает без интернета</div>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="installApp()" style="background:#fff;color:#0d9488;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:13px">Установить</button>
      <button onclick="document.getElementById('install-banner').remove()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:16px">✕</button>
    </div>
  `;
  document.body.appendChild(banner);
  // Автоскрыть через 10 сек
  setTimeout(() => { if (banner.parentNode) banner.remove(); }, 10000);
}

function installApp() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(() => {
      deferredPrompt = null;
      const b = document.getElementById('install-banner');
      if (b) b.remove();
    });
  }
}

// Если уже установлено — скрыть баннер
window.addEventListener('appinstalled', () => {
  const b = document.getElementById('install-banner');
  if (b) b.remove();
  deferredPrompt = null;
});
</script>
